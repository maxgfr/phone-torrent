# Deploy: fly launch --no-deploy && fly secrets set AUTH_TOKEN=$(openssl rand -hex 16) && fly deploy
#
# A machine that keeps running and a disk that stays: downloads carry on and
# keep seeding with the phone off. Like Render, it reaches peers by connecting
# out to them; see [[services]] below for why peers finding it is not to be
# counted on.
app = "phone-torrent"
primary_region = "cdg"

[build]
  dockerfile = "server/Dockerfile"

[env]
  ALLOWED_ORIGINS = "*"
  DOWNLOAD_DIR = "/data/downloads"
  SEED_AFTER_DONE = "1"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # A torrent keeps going with nobody watching, so the machine must not stop
  # when the page is closed.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  # An array of tables: flyctl reads `checks` as a list, and a single table there
  # fails to parse into it.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

# The BitTorrent port (TCP), published on the app's own address: its IPv6, or a
# dedicated IPv4 from `fly ips allocate-v4` (a shared IPv4 carries no raw TCP).
# The server listens on 6881 for it; see TORRENT_PORT. Peers rarely arrive here
# by themselves, though: a tracker hands out the address a machine announced
# from, and a Fly machine announces from its outbound address, which is not the
# one this port is published on. Downloading and seeding over the connections
# it makes itself are unaffected.
[[services]]
  internal_port = 6881
  protocol = "tcp"
  [[services.ports]]
    port = 6881

# Downloaded files live here. Without a volume they vanish on every restart.
# `fly launch` and `fly deploy` create it at this size; left out, Fly makes it
# 1 GB, which a single film fills. Render's is 10 GB too. It can grow later
# (`fly volumes extend <id> -s 50`), never shrink, and is billed by size.
[[mounts]]
  source = "downloads"
  destination = "/data"
  initial_size = "10gb"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
