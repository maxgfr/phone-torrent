# Deploy: fly launch --no-deploy && fly secrets set AUTH_TOKEN=$(openssl rand -hex 16) && fly deploy
#
# Fly gives the machine a public IPv6 (and IPv4 on request), so peers can
# connect back — which makes this the closest thing to a seedbox among the
# one-click options.
app = "phone-torrent"
primary_region = "cdg"

[build]
  dockerfile = "server/Dockerfile"

[env]
  ALLOWED_ORIGINS = "*"
  DOWNLOAD_DIR = "/data/downloads"
  SEED_AFTER_DONE = "1"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # A torrent keeps going with nobody watching, so the machine must not stop
  # when the page is closed.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.checks]
    [http_service.checks.health]
      path = "/api/health"
      interval = "30s"
      timeout = "5s"

# The BitTorrent port, so peers can reach this machine rather than only the
# other way round.
[[services]]
  internal_port = 6881
  protocol = "tcp"
  [[services.ports]]
    port = 6881

# Downloaded files live here. Without a volume they vanish on every restart.
[[mounts]]
  source = "downloads"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
