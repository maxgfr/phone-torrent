# The whole thing in one container: a real BitTorrent client, its API, and the
# app itself on the same origin — so there is no CORS to configure and nothing
# else to deploy.
#
#   docker compose up -d        then open http://localhost:8080
#
# This pulls a prebuilt image rather than building one. To build from source
# instead — which is what you want when you are changing the server — add the
# build overlay:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  phone-torrent:
    image: ghcr.io/maxgfr/phone-torrent:latest
    pull_policy: always
    ports:
      - "8080:8080"
      # The BitTorrent ports: TCP and uTP on 6881, the DHT on 6882. Forward them
      # on your router and peers can connect to you as well as the other way
      # round; without them you can still download.
      - "6881:6881/tcp"
      - "6881:6881/udp"
      - "6882:6882/udp"
    environment:
      # Same-origin by default, because this container serves the app too: no
      # other site the browser has open can call it. Name your GitHub Pages
      # origin here only if you use the hosted page against this server.
      # ALLOWED_ORIGINS: "https://<user>.github.io"
      # Set this the moment the server is reachable from outside your network.
      # Until then the API answers only at localhost or an IP address; to reach
      # it by a name without a token, list the name in ALLOWED_HOSTS.
      # AUTH_TOKEN: "change-me"
      # ALLOWED_HOSTS: "nas.local"
      # Keep seeding once a download finishes: it is how the swarm survives.
      SEED_AFTER_DONE: "1"
    volumes:
      - downloads:/data
    restart: unless-stopped

volumes:
  downloads:
