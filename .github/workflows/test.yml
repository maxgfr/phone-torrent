name: Test

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    name: e2e (${{ matrix.browser }})
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # The server is a different animal from the page: a real BitTorrent client
      # against a real peer, no browser involved. Cheap, so it runs in both jobs.
      - run: npm run test:server
      - run: npm test
        env:
          BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.browser }}
          path: test/.tmp/*.png
          if-no-files-found: ignore
