name: Test

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # DIAG: temporary, to measure the WebKit flake
        browser: [webkit]
        stun: [default, none]
        attempt: [1, 2, 3]
        include:
          - { browser: chromium, stun: default, attempt: 1 }
          - { browser: chromium, stun: none, attempt: 1 }
    name: e2e (${{ matrix.browser }} ${{ matrix.stun }} #${{ matrix.attempt }})
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # The server is a different animal from the page: a real BitTorrent client
      # against a real peer, no browser involved. Cheap, so it runs in both jobs.
      - run: npm run test:server
      - run: npm test
        env:
          BROWSER: ${{ matrix.browser }}
          NO_STUN: ${{ matrix.stun == 'none' && '1' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.browser }}-${{ matrix.stun }}-${{ matrix.attempt }}
          path: test/.tmp/*.png
          if-no-files-found: ignore
