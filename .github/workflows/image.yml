name: Publish the server image

# The README's first recommendation is to run the server on your own machine.
# Building it there means cloning the repo and waiting; publishing the image
# turns that into one `docker compose up`.
#
# Both architectures are built on purpose: arm64 is not an edge case here, it is
# every Apple Silicon Mac and every Raspberry Pi — the machines people actually
# leave running at home.

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "index.html"
      - "app.js"
      - "saver.js"
      - "sw.js"
      - "styles.css"
      - "manifest.webmanifest"
      - "vendor/**"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
